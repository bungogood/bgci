[package]
name = "bgci-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Core execution and persistence for bgci"

[dependencies]
bkgm = { path = "../../../bkgm" }
fastrand = "2.3.0"
indicatif = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = "3.1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
toml = "0.8"
tracing = "0.1"
