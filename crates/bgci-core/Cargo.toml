[package]
name = "bgci-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bkgm = { path = "../../../bkgm" }
clap = { version = "4.5", features = ["derive"] }
fastrand = "2.3.0"
indicatif = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
shellexpand = "3.1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
toml = "0.8"
time = { version = "0.3", features = ["local-offset"] }
tracing = "0.1"
